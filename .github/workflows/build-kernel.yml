name: Build peridot kernel (ReSukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "peridot-dev/android_kernel_xiaomi_sm8635 branch"
        type: string
        default: "lineage-23.2"
      resukisu_tag:
        description: "ReSukiSU branch/tag (no tagged releases yet — use 'main')"
        type: string
        default: "main"
      susfs_branch:
        description: "susfs4ksu branch (must match kernel KMI)"
        type: string
        default: "gki-android14-6.1"
      susfs_ref:
        description: "susfs4ksu commit/tag (empty = HEAD = latest v2.x)"
        type: string
        default: ""
      minimal:
        description: "MINIMAL diagnostic build: KSU only (no SUSFS, no extras). Use to isolate boot loop cause."
        type: boolean
        default: false
      pure:
        description: "PURE diagnostic build: no KSU at all, just stock peridot kernel rebuilt. Use to test build-pipeline soundness."
        type: boolean
        default: false
      release:
        description: "Attach zip to a GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (used when release=true)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/build-kernel.yml"
      - "Dockerfile.kernel"

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-23.2' }}
      RESUKISU_TAG:  ${{ github.event.inputs.resukisu_tag  || 'main' }}
      SUSFS_BRANCH:  ${{ github.event.inputs.susfs_branch  || 'gki-android14-6.1' }}
      SUSFS_REF:     ${{ github.event.inputs.susfs_ref     || '' }}
      MINIMAL_BUILD: ${{ github.event.inputs.minimal       || 'false' }}
      PURE_BUILD:    ${{ github.event.inputs.pure          || 'false' }}
      WORKDIR:       ${{ github.workspace }}/work
      OUTDIR:        ${{ github.workspace }}/out
      CCACHE_DIR:    ${{ github.workspace }}/.ccache
      USE_CCACHE:    "1"
      CCACHE_MAXSIZE: "4G"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev liblz4-tool libssl-dev libxml2-utils \
            cpio rsync zip unzip xz-utils \
            python3 python-is-python3 \
            clang lld llvm \
            dwarves
          clang --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key:  ccache-peridot-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-peridot-${{ env.KERNEL_BRANCH }}-
            ccache-peridot-

      - name: Clone kernel + AnyKernel3 + susfs4ksu
        run: bash kernel/scripts/01_clone.sh

      - name: Install ReSukiSU + apply susfs4ksu kernel patches
        if: ${{ env.PURE_BUILD != 'true' }}
        run: bash kernel/scripts/02_patch.sh

      - name: (PURE) skip all KSU/SUSFS integration, build stock kernel only
        if: ${{ env.PURE_BUILD == 'true' }}
        run: |
          echo "[pure] removing all defconfig fragments — building plain stock peridot kernel"
          rm -f kernel/config/*.fragment
          echo "KERNEL_NAME=PeridotPure" >> $GITHUB_ENV

      - name: (MINIMAL) swap fragments to KSU-only diagnostic config
        if: ${{ env.MINIMAL_BUILD == 'true' }}
        run: |
          echo "[minimal] disabling extras and SUSFS for diagnostic build"
          mv kernel/config/extras.fragment kernel/config/extras.fragment.bak
          cat > kernel/config/ksu_susfs.fragment <<'EOF'
          # MINIMAL diagnostic build: KSU root only, no SUSFS, no extras.
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_TRACEPOINT_HOOK=y
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU_SUSFS=n
          CONFIG_KPM=n
          CONFIG_LOCALVERSION=""
          EOF
          export KERNEL_NAME=PeridotMinimal
          echo "KERNEL_NAME=PeridotMinimal" >> $GITHUB_ENV

      - name: Build kernel Image
        run: bash kernel/scripts/03_build.sh

      - name: Pack AnyKernel3 zip
        run: bash kernel/scripts/04_pack.sh

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PURE_BUILD == 'true' && 'PeridotPure' || (env.MINIMAL_BUILD == 'true' && 'PeridotMinimal' || 'PeridotReSukiSU') }}-AnyKernel3-${{ github.run_number }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create / update Release
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: out/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
